<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E2E: Selection Overlay</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.6; padding: 24px; }
    #text { max-width: 720px; border: 1px solid #ddd; padding: 12px; }
  </style>
  <script>
    // Minimal chrome.runtime stub for content script
    (function() {
      const listeners = new Set();
      window.chrome = {
        runtime: {
          onMessage: {
            addListener(fn) { listeners.add(fn); },
            removeListener(fn) { listeners.delete(fn); },
          },
          sendMessage(msg) {
            if (msg && msg.type === 'translate.selection') {
              // Simulate async translation result
              setTimeout(() => {
                const resp = {
                  type: 'translate.result',
                  id: msg.id,
                  items: [{ id: msg.id + '-0', translated: `[EN] ${msg.text}` }]
                };
                listeners.forEach(fn => fn(resp, {}, () => {}));
              }, 50);
            }
            return Promise.resolve({ ok: true });
          },
        },
      };
    })();
  </script>
  <script src="/packages/ui-content/dist/content.js"></script>
</head>
<body>
  <h1>選択翻訳のテスト</h1>
  <p>以下のテキストの一部を選択すると、翻訳ボタンが表示されます。</p>
  <div id="text">
    これはテストです。日本語の文を選択して翻訳ボタンの挙動を確認します。
  </div>
</body>
</html>
